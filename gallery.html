<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="تصاویر اشعار جبار شفیعی (چیاگوران دالاهو)">
<title>تصاویر | Chiya Guran Dalahoo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #0d1b22;
  --mist: #d8e8e4;
  --dim: #9db4b0;
  --saffron: #e6b95f;
  --line: rgba(216, 232, 228, .22);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--ink); }
body { font-family: "Vazirmatn", Tahoma, "Segoe UI", sans-serif; color: var(--mist); line-height: 1.9; background: transparent; min-height: 100vh; }
#bg { position: fixed; inset: 0; width: 100%; height: 100%; z-index: -1; display: block; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--saffron); outline-offset: 4px; }
.wrap { max-width: 980px; margin: 0 auto; padding: 0 24px; }

header { border-bottom: 1px solid var(--line); background: rgba(13, 27, 34, .72); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); position: sticky; top: 0; z-index: 5; }
header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; padding-top: 14px; padding-bottom: 14px; }
.brand { font-weight: 800; font-size: 1.1rem; letter-spacing: .02em; direction: ltr; }
nav ul { list-style: none; display: flex; gap: 22px; flex-wrap: wrap; }
nav a { color: var(--dim); padding: 4px 0; border-bottom: 2px solid transparent; }
nav a:hover, nav a[aria-current="page"] { color: var(--mist); border-bottom-color: var(--saffron); }

.page-title { padding: 64px 0 24px; }
.page-title h1 { font-size: clamp(1.8rem, 5vw, 2.8rem); font-weight: 800; }
.page-title p { color: var(--dim); margin-top: 8px; }

.grid { columns: 3 220px; column-gap: 16px; }
.grid button { display: block; width: 100%; margin: 0 0 16px; padding: 0; border: 1px solid var(--line); background: rgba(13, 27, 34, .65); cursor: zoom-in; break-inside: avoid; }
.grid img { display: block; width: 100%; height: auto; transition: opacity .2s; }
.grid button:hover img { opacity: .85; }

footer { border-top: 1px solid var(--line); margin-top: 48px; padding: 28px 0 40px; color: var(--dim); font-size: .9rem; background: rgba(13, 27, 34, .72); }

/* نمایش بزرگ */
.lb { position: fixed; inset: 0; z-index: 20; background: rgba(5, 12, 16, .94); display: none; flex-direction: column; align-items: center; justify-content: center; padding: 16px; }
.lb.open { display: flex; }
.lb img { max-width: 100%; max-height: calc(100vh - 120px); object-fit: contain; }
.lb-bar { margin-top: 14px; display: flex; gap: 12px; align-items: center; flex-wrap: wrap; justify-content: center; }
.lb-bar button, .lb-bar a { background: transparent; border: 1px solid var(--mist); color: var(--mist); padding: 6px 18px; font: inherit; cursor: pointer; }
.lb-bar button:hover, .lb-bar a:hover { background: var(--mist); color: var(--ink); }
.lb-count { color: var(--dim); font-size: .9rem; }
@media (max-width: 560px) { nav ul { gap: 14px; } }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>

<header>
  <div class="wrap">
    <a class="brand" href="index.html">Chiya Guran Dalahoo</a>
    <nav aria-label="منوی اصلی">
      <ul>
        <li><a href="index.html">خانه</a></li>
        <li><a href="poems.html">اشعار</a></li>
        <li><a href="gallery.html" aria-current="page">تصاویر</a></li>
        <li><a href="writings.html">نوشته‌ها</a></li>
        <li><a href="book.html">کتاب</a></li>
      </ul>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-title">
    <h1>تصاویر</h1>
    <p>اشعار نوشته‌شده روی تصویر. برای دیدن بزرگ‌تر و دانلود، روی هر تصویر بزنید.</p>
  </div>

  <div class="grid" id="grid"></div>
</main>

<footer>
  <div class="wrap">© ۱۴۰۴ جبار شفیعی (چیاگوران دالاهو)، تمامی حقوق محفوظ است</div>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="نمایش تصویر">
  <img id="lbImg" alt="">
  <div class="lb-bar">
    <button type="button" id="next">بعدی</button>
    <span class="lb-count" id="count"></span>
    <button type="button" id="prev">قبلی</button>
    <a id="dl" href="#" download>دانلود</a>
    <button type="button" id="close">بستن</button>
  </div>
</div>

<script src="bg.js"></script>
<script>
/* ===== فهرست تصاویر =====
   برای افزودن تصویر جدید: فایل را در پوشهٔ images آپلود کنید
   و یک خط مثل خطوط زیر به این فهرست اضافه کنید (ویرگول آخر خط یادتان نرود). */
var IMAGES = [
  { src: "images/autumn-poem.jpeg", alt: "شعر گل حسرت روی تصویر گل‌های بنفش پاییزی" }
  // { src: "images/poem-2.jpg", alt: "توضیح کوتاه تصویر" },
  // { src: "images/poem-3.jpg", alt: "توضیح کوتاه تصویر" },
];

(function () {
  var grid = document.getElementById('grid');
  var lb = document.getElementById('lb');
  var lbImg = document.getElementById('lbImg');
  var count = document.getElementById('count');
  var dl = document.getElementById('dl');
  var cur = 0, opener = null;

  IMAGES.forEach(function (it, i) {
    var b = document.createElement('button');
    b.type = 'button';
    b.setAttribute('aria-label', 'نمایش بزرگ: ' + it.alt);
    var im = document.createElement('img');
    im.src = it.src; im.alt = it.alt; im.loading = 'lazy';
    b.appendChild(im);
    b.addEventListener('click', function () { open(i, b); });
    grid.appendChild(b);
  });

  function show(i) {
    cur = (i + IMAGES.length) % IMAGES.length;
    lbImg.src = IMAGES[cur].src;
    lbImg.alt = IMAGES[cur].alt;
    dl.href = IMAGES[cur].src;
    count.textContent = (cur + 1) + ' / ' + IMAGES.length;
  }
  function open(i, el) {
    opener = el; show(i);
    lb.classList.add('open');
    document.body.style.overflow = 'hidden';
    document.getElementById('close').focus();
  }
  function close() {
    lb.classList.remove('open');
    document.body.style.overflow = '';
    if (opener) opener.focus();
  }
  document.getElementById('close').addEventListener('click', close);
  document.getElementById('next').addEventListener('click', function () { show(cur + 1); });
  document.getElementById('prev').addEventListener('click', function () { show(cur - 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) close(); });
  document.addEventListener('keydown', function (e) {
    if (!lb.classList.contains('open')) return;
    if (e.key === 'Escape') close();
    if (e.key === 'ArrowLeft') show(cur + 1);   /* در صفحهٔ راست‌به‌چپ، چپ یعنی بعدی */
    if (e.key === 'ArrowRight') show(cur - 1);
  });
})();
</script>
</body>
</html>
